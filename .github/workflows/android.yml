name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

# Nécessaire pour publier l'APK dans les Releases.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Clé de signature stable, si elle est configurée dans les secrets du dépôt.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.SILLAGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SILLAGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SILLAGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SILLAGE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sillage.jks"
            {
              echo "SILLAGE_KEYSTORE_FILE=$RUNNER_TEMP/sillage.jks"
              echo "SILLAGE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SILLAGE_KEY_ALIAS=$KEY_ALIAS"
              echo "SILLAGE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signature avec la clé du projet."
          else
            echo "::warning::Pas de clé SILLAGE_KEYSTORE_BASE64 : APK signé avec une clé temporaire, les mises à jour ne s'installeront pas par-dessus."
          fi

      - name: Tests (GPX, enregistrement, cartes, captures d'écran)
        run: ./gradlew :app:testDebugUnitTest

      - name: APK debug et release
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Préparer l'APK et les notes de version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Sillage.apk
          {
            echo "Sillage $VERSION — branche \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA::7}."
            echo
            echo "**Installer :** téléchargez **Sillage.apk** ci-dessous depuis le téléphone, puis ouvrez-le"
            echo "(autorisez l'installation depuis votre navigateur si Android le demande)."
            if [ -n "${SILLAGE_KEYSTORE_FILE:-}" ]; then
              echo "Les versions suivantes s'installent par-dessus, sans perdre vos traces."
            else
              echo "⚠️ Signée avec une clé temporaire : désinstallez la version précédente avant d'installer celle-ci."
            fi
            echo
            echo "### Changements"
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^[[:space:]]*$/N;/^\n$/D'
          } > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: sillage-apk
          path: |
            dist/Sillage.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publier dans les Releases GitHub
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Sillage ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          files: dist/Sillage.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-et-rapports
          path: |
            app/build/screenshots
            app/build/reports/tests
